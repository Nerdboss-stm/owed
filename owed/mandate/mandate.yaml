# The mandate. Set once by the freelancer, edited from the desk. Read by planner (day thresholds),
# drafter (voice, tone, never-list) and verifier (never-list, tone).
steps: 3
signoff: Saran
voice: mine
tone:
- never angry
- never apologetic
- never threatening
never:
- offer a discount
- change the amount
- promise a deadline extension
approval: nothing past step 2 sends without my tap
step_1:
  day: 3
  action: soft nudge
step_2:
  day: 10
  action: direct ask + payment link
step_3:
  day: 21
  action: propose a call (calendar slot)
  requires_tap: true
