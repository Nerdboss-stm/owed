<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OWED · Priya's desk</title>
<link rel="stylesheet" href="/owed.css">
<style>
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 28px; }
  .grid { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 20px; }
  .item { padding: 12px 0; border-bottom: 1px solid #161e29; font-size: 17px; line-height: 1.45; }
  .item:last-child { border-bottom: 0; }
  .item .why { color: #b7c2cf; }
  .approve { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-top: 1px solid #1f2a37; }
  .src { color: #8b98a8; font-size: 13px; text-transform: none; letter-spacing: 0; font-weight: 400; }
  #overdue td:first-child { font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><b>OWED</b><a href="/">← home</a><a href="/client">be the client</a></div>

  <div class="top">
    <p class="lead" style="margin:0">Priya's desk: this is what the agent wants to send today, and what it refused.</p>
    <label class="row small mute" style="flex-wrap:nowrap">Try a scenario
      <select id="scenario" class="select" style="min-width:280px"></select>
    </label>
  </div>

  <div class="grid">
    <div class="stack">
      <section class="card">
        <h2>Overdue <span id="overdueSrc" class="src"></span></h2>
        <div class="body">
          <table id="overdue">
            <thead><tr><th>Client</th><th class="num">Amount</th><th class="num">Days overdue</th><th class="num">Last step</th></tr></thead>
            <tbody><tr><td colspan="4" class="mute">loading…</td></tr></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>Today's rehearsal <span id="rehSrc" class="src"></span></h2>
        <div class="body">
          <div class="mute small" style="margin-bottom:6px">WILL SEND <span id="sendN" class="mono"></span></div>
          <div id="sends"></div>
          <div class="mute small" style="margin:18px 0 6px">REFUSED <span id="refN" class="mono"></span></div>
          <div id="refs"></div>
        </div>
        <div class="approve">
          <button id="approve" class="btn btn-ok" disabled title="approval happens on the freelancer's machine">Approve ✅</button>
          <span id="approveNote" class="mute small">approval happens on the freelancer's machine</span>
        </div>
      </section>
    </div>

    <div class="stack">
      <section class="card">
        <details>
          <summary>End state <span id="endN" class="mono"></span></summary>
          <div class="body" id="endstate"><div class="mute small">not asserted in this plan</div></div>
        </details>
        <details>
          <summary>Trace <span id="traceN" class="mono"></span></summary>
          <div class="body log" id="trace" style="max-height:520px;overflow:auto"></div>
        </details>
      </section>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = (n) => (n == null || n === '') ? '' : '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const APP = { stripe: 'Stripe', gmail: 'Gmail', calendar: 'Calendar', slack: 'Slack', ledger_json: 'ledger.json' };
  let lastRun = null;

  async function getJSON(url) {
    const r = await fetch(url, { cache: 'no-store' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || (r.status + ' ' + r.statusText));
    return d;
  }

  // ---------- overdue rows: plan.invoices when the plan has them, else the trace's read_ledger line ----------
  function overdueRows(plan, trace) {
    if (Array.isArray(plan.invoices) && plan.invoices.length) {
      return plan.invoices.map(i => ({
        client: i.client_name || i.client_email || i.invoice_id, id: i.invoice_id, amount: i.amount_due,
        days: i.days_overdue, last: i.last_chased_step ?? 0 }));
    }
    const rl = (trace || []).find(t => t.phase === 'read_ledger' && t.data && Array.isArray(t.data.invoices));
    if (!rl) return [];
    return rl.data.invoices.map(i => {
      const sent = (plan.intents || []).find(x => x.invoice_id === i.invoice_id && x.kind === 'send_email');
      const dec = (trace || []).find(t => t.phase === 'decide' && t.invoice_id === i.invoice_id && t.data && t.data.step != null);
      return { client: sent ? sent.payload.to : i.invoice_id, id: i.invoice_id, amount: i.amount_due, days: i.days,
               last: dec ? Math.max(0, dec.data.step - 1) : '' };
    });
  }

  function renderOverdue(rows, src) {
    $('overdueSrc').textContent = src;
    $('overdue').querySelector('tbody').innerHTML = rows.length ? rows.map(r => `
      <tr><td>${esc(r.client)} <span class="mute mono small">${esc(r.id)}</span></td>
          <td class="num mono">${esc(money(r.amount))}</td><td class="num mono">${esc(r.days)}</td><td class="num mono">${esc(r.last)}</td></tr>`).join('')
      : `<tr><td colspan="4" class="mute">nothing overdue</td></tr>`;
  }

  // ---------- rehearsal ----------
  function sendLine(it, all) {
    const p = it.payload || {};
    const extras = all.filter(x => x.idempotency_key === it.idempotency_key && x.kind !== 'send_email')
      .map(x => x.kind === 'create_payment_link' ? '+ payment link' : x.kind === 'create_event' ? '+ calendar event' : x.kind === 'post_chat' ? '+ slack post' : '').filter(Boolean).join(' ');
    return `<div class="item"><span class="send">WILL SEND</span> ${esc(it.invoice_id)} step ${esc(it.step)} → ${esc(p.to)} <span class="why">“${esc(p.subject)}”</span> <span class="mono">${esc(money(p.amount))}</span> <span class="mute">${esc(extras)}</span>${it.requires_tap ? ' <span class="chip chip-warn">needs tap</span>' : ''}</div>`;
  }

  function renderPlan(plan, src) {
    const intents = plan.intents || [], refusals = plan.refusals || [];
    const sends = intents.filter(i => i.kind === 'send_email');
    const others = intents.filter(i => !sends.some(s => s.idempotency_key === i.idempotency_key));
    $('rehSrc').textContent = src;
    $('sendN').textContent = sends.length + others.length;
    $('refN').textContent = refusals.length;
    $('sends').innerHTML = (sends.map(s => sendLine(s, intents)).join('') +
      others.map(o => `<div class="item"><span class="send">WILL DO</span> ${esc(o.kind)} ${esc(o.invoice_id)} step ${esc(o.step)} <span class="why">${esc(o.payload?.text || '')}</span></div>`).join(''))
      || `<div class="item mute">nothing: no email, no link, no event</div>`;
    $('refs').innerHTML = refusals.map(r => `<div class="item"><span class="refused">REFUSED</span> ${esc(r.invoice_id)} step ${esc(r.step)}: <span class="chip chip-bad">${esc(r.reason)}</span> <span class="why">${esc(r.detail)}</span></div>`).join('')
      || `<div class="item mute">none</div>`;

    const es = Array.isArray(plan.end_state) ? plan.end_state : [];
    $('endN').textContent = es.length ? `${es.filter(e => e.expected === e.actual).length}/${es.length}` : '';
    $('endstate').innerHTML = es.length ? es.map(e => { const ok = e.expected === e.actual; return `
      <div class="line"><span style="width:10px;height:10px;border-radius:50%;background:${ok ? '#3fb950' : '#f85149'};display:inline-block"></span>
      <span style="min-width:80px;font-weight:600">${esc(APP[e.app] || e.app)}</span><span class="mono ${ok ? 'send' : 'refused'}">${esc(e.actual)}<span class="mute">/${esc(e.expected)}</span></span>
      <span class="mute small">${esc(e.detail || '')}</span></div>`; }).join('') : `<div class="mute small">not asserted in this plan</div>`;

    const tr = Array.isArray(plan.trace) ? plan.trace : [];
    $('traceN').textContent = tr.length || '';
    $('trace').innerHTML = tr.map(t => { const d = (t.decision || '').toUpperCase();
      const cls = t.phase === 'abort' || d.startsWith('REFUSED') || d.includes('ABORTED') || d.startsWith('FAILED') ? 'bad'
        : d.startsWith('PASS') || d.startsWith('SENT') || d.startsWith('CREATED') || d.includes('END STATE OK') || t.phase === 'done' ? 'ok'
        : t.phase === 'decide' || t.phase === 'tap' || t.phase === 'posted_plan' ? 'decide' : t.phase === 'reverify' ? 'warn' : '';
      return `<div><span class="mute">${esc((t.ts || '').slice(11, 19))}</span> <span class="mute">${esc(t.phase)}</span> <span class="${cls}">${esc(t.decision)}</span></div>`; }).join('')
      || `<div class="mute small">no trace</div>`;
  }

  function showLastRun() {
    const plan = Object.assign({}, lastRun.plan || {}, { trace: lastRun.trace || [] });
    const when = (lastRun.uploaded_at || plan.created_at || '').replace('T', ' ').slice(0, 16);
    renderOverdue(overdueRows(plan, plan.trace), `last real run · ${when}`);
    renderPlan(plan, `last real run ${esc(lastRun.run_id || '')}`);
  }

  async function showScenario(name) {
    $('rehSrc').innerHTML = '<span class="spin"></span>';
    try {
      const plan = await getJSON(`/api/rehearse?scenario=${encodeURIComponent(name)}`);
      const src = plan.source === 'live' ? 'live' : plan.source === 'shadow' ? 'shadow rehearsal, template draft' : 'precomputed';
      renderOverdue(overdueRows(plan, plan.trace), src);
      renderPlan(plan, src + (plan.live_error ? ' · live fell back' : ''));
    } catch (e) {
      $('rehSrc').textContent = e.message;
    }
  }

  $('scenario').addEventListener('change', () => {
    const v = $('scenario').value;
    location.hash = v;
    if (v === '__last') showLastRun(); else showScenario(v);
  });

  (async () => {
    const [scn, lr] = await Promise.all([
      getJSON('/api/scenarios').catch(() => ({ scenarios: [] })),
      getJSON('/api/last_run').catch(() => ({ available: false })),
    ]);
    lastRun = lr && lr.available ? lr : null;
    const opts = [];
    if (lastRun) opts.push(`<option value="__last">Last real run</option>`);
    (scn.scenarios || []).forEach(s => opts.push(`<option value="${esc(s.name)}">${esc(s.title)}</option>`));
    $('scenario').innerHTML = opts.join('');
    const want = location.hash.replace('#', '');
    const names = (scn.scenarios || []).map(s => s.name);
    if (want === '__last' && lastRun) { $('scenario').value = '__last'; showLastRun(); }
    else if (names.includes(want)) { $('scenario').value = want; showScenario(want); }
    else if (lastRun) { $('scenario').value = '__last'; showLastRun(); }
    else if (names.length) { $('scenario').value = names[0]; showScenario(names[0]); }
    else $('rehSrc').textContent = 'no scenarios';
  })();
})();
</script>
</body>
</html>
